<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E4F5C">
<title>Scotland Wedding Trip</title>
<style>
:root{--bg:#F2F4F1;--surface:#FFFFFF;--line:#D5DCD5;--fg:#18221E;--muted:#5A6760;--loch:#1E4F5C;--heather:#7A3F86;--bad:#A3322A}
@media (prefers-color-scheme: dark){:root{--bg:#111715;--surface:#19211E;--line:#2E3934;--fg:#E6ECE8;--muted:#9AA8A1;--loch:#86BCC9;--heather:#D2A6DC;--bad:#F08A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.tartan{position:fixed;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--loch) 0 10px,transparent 10px 14px,var(--heather) 14px 18px,transparent 18px 22px)}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:12px}
h1{font:400 1.35rem/1.2 Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:.92rem}
label{font-weight:600;font-size:.9rem}
input[type=password]{width:100%;font:600 1.6rem/1.2 inherit;font-family:inherit;letter-spacing:.5em;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:600 1rem inherit;font-family:inherit;padding:11px;border:0;border-radius:8px;background:var(--loch);color:var(--bg);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--heather);outline-offset:2px}
[hidden]{display:none!important}
#msg{color:var(--bad);font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<div class="tartan" aria-hidden="true"></div>
<form id="f" autocomplete="off">
  <h1>Scotland Wedding Trip</h1>
  <p>Enter the 4-digit PIN to open it.</p>
  <label for="pw">PIN</label>
  <input type="password" id="pw" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required>
  <label class="row"><input type="checkbox" id="remember" checked> Remember on this phone</label>
  <button type="submit" id="go">Open</button>
  <div id="msg" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYNAME = "trip-key-" + SALT.slice(0,8);
async function deriveRaw(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"}, base, 256));
}
async function openWith(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(DATA));
  const html = new TextDecoder().decode(plain);
  if(document.readyState !== "complete"){ await new Promise(r => window.addEventListener("load", r, {once:true})); }
  document.open(); document.write(html); document.close();
}
const toB64 = u => btoa(String.fromCharCode(...u));
(async()=>{
  let k=null; try{ k = localStorage.getItem(KEYNAME); }catch(_){}
  if(!k) return;
  document.getElementById("f").hidden = true;
  try{ await openWith(b64(k)); }
  catch(e){ try{localStorage.removeItem(KEYNAME)}catch(_){} document.getElementById("f").hidden = false; }
})();
document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=document.getElementById("msg"), go=document.getElementById("go");
  msg.textContent=""; go.disabled=true; go.textContent="Opening…";
  try{
    const raw = await deriveRaw(document.getElementById("pw").value);
    if(document.getElementById("remember").checked){ try{localStorage.setItem(KEYNAME, toB64(raw))}catch(_){} }
    await openWith(raw);
  }catch(err){
    msg.textContent="That PIN did not work. Try again."; document.getElementById("pw").value="";
    go.disabled=false; go.textContent="Open";
  }
});
document.getElementById("pw").addEventListener("input", e=>{ if(/^\d{4}$/.test(e.target.value)) document.getElementById("f").requestSubmit(); });
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
